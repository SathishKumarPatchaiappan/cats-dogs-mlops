name: CI-CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: |
          docker build -t cats-dogs-mlops .

      - name: Run Docker container
        run: |
          docker run -d -p 8000:8000 --name cats-dogs-app cats-dogs-mlops

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl --fail http://127.0.0.1:8000/health; then
              echo "Health check passed"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 10
          done

          echo "Health check failed"
          docker logs cats-dogs-app
          exit 1